name: Refresh Market Data

on:
  schedule:
    # 5:00 AM ICT Tuesday-Saturday (22:00 UTC Monday-Friday),
    # after the US regular market close for the trading day.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh data snapshot
        run: npm run refresh:data
        env:
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS || 'VST,RGTI,IONQ,LAC,UAMY,SNPS,QCOM,RRX' }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      - run: npm run validate:data
      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} --ff-only
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): refresh market dashboard data'
          file_pattern: public/data/*.json
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
