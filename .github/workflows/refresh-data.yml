name: Refresh Market Data

on:
  schedule:
    # 5:00 AM ICT Tuesday-Saturday (22:00 UTC Monday-Friday),
    # after the US regular market close for the trading day.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh data snapshot
        run: npm run refresh:data
        env:
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS || 'VST,RGTI,IONQ,LAC,UAMY,SNPS,QCOM,RRX' }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      - run: npm run validate:data
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): refresh market dashboard data'
          file_pattern: public/data/*.json
